<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />
		<link
			rel="stylesheet"
			href="%sveltekit.assets%/fonts/Pretendard-1.3.9/web/variable/pretendardvariable.css"
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/Sora/Sora-VariableFont_wght.ttf"
			as="font"
			type="font/ttf"
			crossorigin="anonymous"
		/>
		<style>
			@font-face {
				font-family: Sora;
				src: url('%sveltekit.assets%/fonts/Sora/Sora-VariableFont_wght.ttf') format('truetype');
				font-style: normal;
				font-weight: 100 800;
				font-display: swap;
			}
		</style>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
