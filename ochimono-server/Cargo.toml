[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Levi Laine <levi.laine.me@gmail.com>"]
repository = "https://github.com/levish0/ochimono"
rust-version = "1.98.0"
license = "AGPL-3.0-only"
description = "The ochimono game server"

[workspace.lints.clippy]
# Service/repository signatures thread many explicit dependencies by design.
too_many_arguments = "allow"
# `routes/routes.rs`, `fold/fold.rs` etc. are a deliberate naming convention here.
module_inception = "allow"

[workspace.dependencies]
# Internal crates
auth-core = { path = "crates/auth-core" }
entity = { path = "crates/entity" }
config = { path = "crates/config" }
dto = { path = "crates/dto" }
errors = { path = "crates/errors" }
server = { path = "crates/server" }

# External dependencies
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["multipart", "macros", "ws"] }
http = "1.5.0"
axum-extra = { version = "0.12.6", features = ["typed-header", "query"] }
tower = { version = "0.5.3", features = ["timeout", "limit", "buffer"] }
tower-http = { version = "0.7.1", features = ["cors", "auth", "trace", "request-id"] }
tower-cookies = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_path_to_error = "0.1.20"
serde_with = "3.22.0"
serde_json = "1.0.151"
serde_json_canonicalizer = "0.3.2"
sea-orm = { version = "2.0.2", features = ["postgres-array", "sqlx-postgres", "runtime-tokio-rustls", "with-ipnetwork"] }
# `runtime-tokio-rustls` + `sqlx-postgres`: the ASYNC_RUNTIME / DATABASE_DRIVER pair the migration CLI needs.
sea-orm-migration = { version = "2.0.2", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
ipnetwork = "0.21.1"
redis = { version = "1.6.0", features = ["tokio-comp", "tokio-rustls-comp", "connection-manager"] }
tokio-cron-scheduler = "0.15.1"
argon2 = "0.6.0"
aes-gcm = "0.11.1"
subtle = "2.6.1"
oauth2 = { version = "5.0.0" }
oauth2-reqwest = "0.1.0-alpha.3"
totp-rs = { version = "6.0.0", features = ["qr"] }
cookie = "0.18.2"
aws-sdk-s3 = "1.144.0"
aws-config = { version = "1.11.0", features = ["behavior-version-latest"] }
meilisearch-sdk = { version = "0.33.0" }
utoipa = { version = "5.5.0", features = ["axum_extras", "openapi_extensions", "time", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "debug-embed", "vendored"] }
validator = { version = "0.21.0", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
tracing-appender = "0.2.5"
reqwest = { version = "0.13.4", features = ["json", "multipart", "stream"] }
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
uuid = { version = "1.26.0", features = ["v7", "v4"] }
dotenvy = "0.15.7"
rand = "0.10.2"
ring = "0.17.14"
png = "0.18.1"
hex = "0.4.3"
base64 = "0.23.1"
bytes = "1.12.1"
threeway_merge = "0.1.20"
blake3 = "1.8.7"
sha2 = "0.11.0"
minicbor = { version = "2.3.0", features = ["std"] }
zstd = "0.13.3"
# `default-features = false` drops lettre's default `native-tls`; the rest of the list restores its defaults.
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "pool", "hostname", "builder", "tokio1-rustls-tls"] }
mrml = "6.0.1"
minijinja = { version = "2.23.0", features = ["loader"] }
similar = "3.2.0"
futures = "0.3.34"
multer = "3.1.0"
mime = "0.3.17"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio-util = { version = "0.7.19", features = ["io"] }
async-nats = { version = "0.50.0", default-features = false, features = ["aws-lc-rs", "jetstream", "nkeys", "nuid", "server_2_10", "server_2_11", "server_2_12", "server_2_14", "websockets"] }
nkeys = "0.4.5"
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
sitemap-rs = "0.4.0"
strum = { version = "0.28.0", features = ["derive"] }
url = "2.5.8"
percent-encoding = "2.3.2"
urlencoding = "2.1.3"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }

[profile.dev]
opt-level = 1
