name: ochimono-dev
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ochimono
      POSTGRES_PASSWORD: ochimono
      POSTGRES_DB: ochimono
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ochimono -d ochimono"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:63790:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  server:
    build: .
    environment:
      SERVER_BIND_ADDRESS: 0.0.0.0:8000
      RUST_LOG: info
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  postgres-data:
  redis-data:
